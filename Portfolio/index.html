<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="intro-active page-home">
  <header class="site-header">
    <nav class="top-nav" aria-label="Primary">
      <div class="top-nav__links">
        <a class="top-nav__link" href="HtmlPages/about.html">About Me</a>
        <a class="top-nav__link" href="HtmlPages/Contacts.html">Contacts</a>
      </div>
      <img class="site-title" src="png.png" alt="Cole Louie" />
      <span class="top-nav__spacer" aria-hidden="true"></span>
    </nav>
    <div class="header-divider" aria-hidden="true"></div>
  </header>

  <section class="intro-overlay" aria-label="Portfolio intro animation">
    <img
      class="intro-logo"
      src="png.png"
      alt="Cole Louie"
    />
    <p class="intro-subtitle">A Graphic Design Portfolio</p>
  </section>

  <main class="portfolio-layout">
    <section id="projects" class="project-row">
      <button type="button" class="project-tile" data-href="HtmlPages/motion-graphic-design.html" aria-label="Open Motion Graphic Design project" data-title="Motion Graphic Design">
        <div class="tile-image tile-image-top"></div>
      </button>
      <button type="button" class="project-tile" data-href="HtmlPages/jsa-poster-designs.html" aria-label="Open Japanese Student Association Marketing Design project" data-title="Japanese Student Association Marketing Design">
        <div class="tile-image tile-image-1"></div>
      </button>
      <button type="button" class="project-tile" data-href="HtmlPages/misc-poster-designs.html" aria-label="Open Poster and Typographic Designs project" data-title="Poster and Typographic Designs">
        <div class="tile-image tile-image-3"></div>
      </button>
      <button type="button" class="project-tile" data-href="HtmlPages/interactive-designs.html" aria-label="Open Interactive Web Designs project" data-title="Interactive Web Designs">
        <div class="tile-image tile-image-2"></div>
      </button>
      <button type="button" class="project-tile" data-href="HtmlPages/SidePrintBuisness.html" aria-label="Open Side Print Buisness project" data-title="Side Print Buisness">
        <div class="tile-image tile-image-4"></div>
      </button>
      <button type="button" class="project-tile" data-href="HtmlPages/portrait-designs.html" aria-label="Open Portrait Designs project" data-title="Portrait Designs">
        <div class="tile-image tile-image-5"></div>
      </button>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
