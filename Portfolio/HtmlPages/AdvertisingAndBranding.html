<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A.I Artworks — Cole Louie</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="page-motion-mg page-ai-artworks">
  <header class="site-header">
    <nav class="top-nav top-nav--return-only" aria-label="Primary">
      <button type="button" class="motion-mg-return motion-mg-return--header" data-href="../index.html">Return</button>
      <img class="site-title" src="../png.png" alt="Cole Louie" />
      <span class="top-nav__spacer" aria-hidden="true"></span>
    </nav>
    <div class="header-divider" aria-hidden="true"></div>
  </header>

  <main class="portfolio-layout project-detail motion-mg-page">
    <div class="motion-mg-list">
      <div class="motion-mg-list__inner">
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Works/Ads/Fix.png"
          data-secondary-src="../Works/Ads/Bread%20Var_41.jpg"
          data-title="Bread: The Odd Object"
          data-body="The Odd Object project takes everyday objects and perishable items and utilizes the latest Adobe Ai models to create symbolic, iconic, and indexical imagery. This project’s main intent was to teach the tools of AI image generation in adobe products, exercising the basic skills in creating descriptive prompts in order for the program to produce the best quality image. The images below are highlights from both the results of Adobe Firefly and Express tools and how I utilized descriptive writing. Outside of image generation, this exercise is also practice understanding the principles of design and advertising following the 3 common themes below."
        >
          <span class="motion-mg-card__title">Bread: The Odd Object</span>
          <span class="motion-mg-card__lead">Using the mundane object of bread for advertising and style studies!</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Works/Ads/Stone_4.jpg"
          data-secondary-src="../Works/Ads/Silver_2.jpg"
          data-title="Shape-Image-Meaning"
          data-body="The shape being shown is an illustrator design that was meant to test the AI's capabilities in lighting and depth having lots of curves with a very minimal amount of hard edges and opportunity to become a 3D model. To describe the shape objectively, it was made up of fairly wide rounded edges with no sharp corners, has an asymmetrical build, and has three main protrusions created to create dark and light contrasts on the object. During the Creation process, I didn't go with a specific design in mind but I did go with my memory on an abstract piece I remember seeing in my childhood and basing it off on pure callback knowledge. Regarding the prompt generation, I wanted to add emphasis on shiny, intricate, and small detailed texture objects to showcase the extent of the image generation. As mentioned previously the design of the shape being rounded was to see if the AI can create realistic lighting while turning a flat object into something 3D. To experiment with firefly's AI, I evolved the prompts starting with earthy textures with detail on the type of lighting which then morphed into toning back the lighting prompt details but turning the object into a reflective smooth texture. The images showcased represent the best of the batch of over 20 images generated for this project."
        >
          <span class="motion-mg-card__title">Shape-Image-Meaning</span>
          <span class="motion-mg-card__lead">Taking an abstract shape and adding textures!</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Works/Ads/O3.jpg"
          data-secondary-src="../Works/Ads/O4.jpg"
          data-title="Onitsuka Branding"
          data-body="For this project, we were tasked on utilizing Adobe Firefly and Adobe Photoshop to create 3D logos for brands as if they were being advertised on a poster or bus stop. The brand that I chose for this project was the Japanese clothing brand &quot;Onitsuka Tiger&quot;. With the brand in mind, I wanted to visually show the brand as a well refined and established brand."
        >
          <span class="motion-mg-card__title">Onitsuka Branding</span>
          <span class="motion-mg-card__lead">Using Firefly for brand design!</span>
        </button>
      </div>
    </div>
  </main>

  <div class="motion-mg-expand motion-mg-expand--poster" id="motion-expand" hidden role="dialog" aria-modal="true" aria-labelledby="motion-expand-title">
    <div class="motion-mg-expand__backdrop" data-motion-close></div>
    <div class="motion-mg-expand__panel">
      <button type="button" class="motion-mg-expand__close" data-motion-close aria-label="Close">×</button>
      <h2 id="motion-expand-title" class="motion-mg-expand__title"></h2>
      <div class="motion-mg-expand__grid">
        <div class="motion-mg-expand__media">
          <video class="motion-mg-expand__video" controls playsinline preload="metadata" hidden>
            <source src="" type="video/mp4" />
          </video>
          <img class="motion-mg-expand__image" src="" alt="" hidden />
          <img class="motion-mg-expand__image-secondary" src="" alt="" hidden />
        </div>
        <div class="motion-mg-expand__body" id="motion-expand-body"></div>
      </div>
    </div>
  </div>
  <script src="../script.js"></script>
</body>
</html>
