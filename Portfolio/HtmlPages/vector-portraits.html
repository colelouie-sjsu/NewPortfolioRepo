<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vector Portraits — Cole Louie</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="page-vector-portraits page-ai-artworks page-motion-mg">
  <div class="vector-scroll-bg" aria-hidden="true">
    <div class="vector-scroll-bg__track vector-scroll-bg__track--forward">
      <div class="vector-scroll-bg__set">
        <img src="../Compressed%20Vectors/TZUYU%201-01.png" alt="" />
        <img src="../Compressed%20Vectors/Vector%20Portrait.png" alt="" />
        <img src="../Compressed%20Vectors/Taka%202-01.png" alt="" />
        <img src="../Compressed%20Vectors/Rose%20Framing-01-01.png" alt="" />
        <img src="../Compressed%20Vectors/Jung%20Hoo%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Sho%20Time%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Hyeseoung%20Kim-01-01.png" alt="" />
      </div>
      <div class="vector-scroll-bg__set">
        <img src="../Compressed%20Vectors/TZUYU%201-01.png" alt="" />
        <img src="../Compressed%20Vectors/Vector%20Portrait.png" alt="" />
        <img src="../Compressed%20Vectors/Taka%202-01.png" alt="" />
        <img src="../Compressed%20Vectors/Rose%20Framing-01-01.png" alt="" />
        <img src="../Compressed%20Vectors/Jung%20Hoo%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Sho%20Time%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Hyeseoung%20Kim-01-01.png" alt="" />
      </div>
    </div>
    <div class="vector-scroll-bg__track vector-scroll-bg__track--reverse">
      <div class="vector-scroll-bg__set">
        <img src="../Compressed%20Vectors/Hyeseoung%20Kim-01-01.png" alt="" />
        <img src="../Compressed%20Vectors/Sho%20Time%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Jung%20Hoo%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Rose%20Framing-01-01.png" alt="" />
        <img src="../Compressed%20Vectors/Taka%202-01.png" alt="" />
        <img src="../Compressed%20Vectors/Vector%20Portrait.png" alt="" />
        <img src="../Compressed%20Vectors/TZUYU%201-01.png" alt="" />
      </div>
      <div class="vector-scroll-bg__set">
        <img src="../Compressed%20Vectors/Hyeseoung%20Kim-01-01.png" alt="" />
        <img src="../Compressed%20Vectors/Sho%20Time%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Jung%20Hoo%20poster-01.png" alt="" />
        <img src="../Compressed%20Vectors/Rose%20Framing-01-01.png" alt="" />
        <img src="../Compressed%20Vectors/Taka%202-01.png" alt="" />
        <img src="../Compressed%20Vectors/Vector%20Portrait.png" alt="" />
        <img src="../Compressed%20Vectors/TZUYU%201-01.png" alt="" />
      </div>
    </div>
  </div>
  <header class="site-header">
    <nav class="top-nav top-nav--return-only" aria-label="Primary">
      <button type="button" class="motion-mg-return motion-mg-return--header" data-href="../index.html">Return</button>
      <img class="site-title" src="../png.png" alt="Cole Louie" />
      <span class="top-nav__spacer" aria-hidden="true"></span>
    </nav>
    <div class="header-divider" aria-hidden="true"></div>
  </header>

  <main class="portfolio-layout project-detail motion-mg-page">
    <div class="motion-mg-list">
      <div class="motion-mg-list__inner">
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Compressed%20Vectors/TZUYU%201-01.png"
          data-title="TZUYU Portrait Study"
          data-body="This portrait is the first vector I have made with a woman as a subject as I wanted to experiment and learn how to vectorize hair especially with the amount of detail and contrast that this image has. Making this portrait about Tzuyu was also a fair way of learning how to simplify skin and clothing."
        >
          <span class="motion-mg-card__title">TZUYU Portrait Study</span>
          <span class="motion-mg-card__lead">Vector portrait study focused on hair detail and simplification.</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Compressed%20Vectors/Vector%20Portrait.png"
          data-title="Personal Portrait Vector"
          data-body="This is one of the latest and most detailed portraits that I have created! For this portrait, I wanted to focus on the details around the nose, mouth, and eyes which was no easy feat as the photo I chose was in direct sunlight creating sharp contrasts and leaking lights on my hair."
        >
          <span class="motion-mg-card__title">Personal Portrait Vector</span>
          <span class="motion-mg-card__lead">A detailed personal portrait study in sharp sunlight.</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Compressed%20Vectors/Taka%202-01.png"
          data-title="Taka Portrait"
          data-body="This portrait was created as a present but I ended up learning more how to vector design around specific clothing and textures."
        >
          <span class="motion-mg-card__title">Taka Portrait</span>
          <span class="motion-mg-card__lead">A gift portrait exploring clothing and texture.</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Compressed%20Vectors/Rose%20Framing-01-01.png"
          data-title="Rose Framing Composition"
          data-body="This portrait was another experiment with vector designs specifically with hair again but with the added challenge that it was poking outside of the body with the question of how to keep the portrait simple."
        >
          <span class="motion-mg-card__title">Rose Framing Composition</span>
          <span class="motion-mg-card__lead">Hair and framing experiment beyond the body silhouette.</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Compressed%20Vectors/Jung%20Hoo%20poster-01.png"
          data-title="Jung Hoo Poster"
          data-body="This is the first vector portrait that I have made with the essence of poster design hence the korean backdrop and Jung Hoo Lee bleeding over the borders of the image."
        >
          <span class="motion-mg-card__title">Jung Hoo Poster</span>
          <span class="motion-mg-card__lead">Poster-style vector portrait with border bleed.</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Compressed%20Vectors/Sho%20Time%20poster-01.png"
          data-title="Sho Time Poster"
          data-body="This was one of the first larger portraits I have created with vector design. The detailing is near the same degree as the Jung Hoo Lee poster but with more focus on the face and glove."
        >
          <span class="motion-mg-card__title">Sho Time Poster</span>
          <span class="motion-mg-card__lead">A larger portrait focused on face and glove detail.</span>
        </button>
        <button
          type="button"
          class="motion-mg-card"
          data-media-type="image"
          data-media-src="../Compressed%20Vectors/Hyeseoung%20Kim-01-01.png"
          data-title="Hyeseoung Kim Portrait"
          data-body="This portrait was a simple study on image simplification."
        >
          <span class="motion-mg-card__title">Hyeseoung Kim Portrait</span>
          <span class="motion-mg-card__lead">A simple study in image simplification.</span>
        </button>
      </div>
    </div>
  </main>

  <div class="motion-mg-expand motion-mg-expand--poster" id="motion-expand" hidden role="dialog" aria-modal="true" aria-labelledby="motion-expand-title">
    <div class="motion-mg-expand__backdrop" data-motion-close></div>
    <div class="motion-mg-expand__panel">
      <button type="button" class="motion-mg-expand__close" data-motion-close aria-label="Close">×</button>
      <h2 id="motion-expand-title" class="motion-mg-expand__title"></h2>
      <div class="motion-mg-expand__grid">
        <div class="motion-mg-expand__media">
          <video class="motion-mg-expand__video" controls playsinline preload="metadata" hidden>
            <source src="" type="video/mp4" />
          </video>
          <img class="motion-mg-expand__image" src="" alt="" hidden />
        </div>
        <div class="motion-mg-expand__body" id="motion-expand-body"></div>
      </div>
    </div>
  </div>
  <script src="../script.js"></script>
</body>
</html>
